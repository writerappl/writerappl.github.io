    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Writer V7.2 (Live)</title>
    
    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* --- RESET & VARIABLES --- */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        :root { 
            --bg-color: #050505; --sidebar-bg: #000000; --card-bg: #0a0a0a;
            --text-main: #ffffff; --text-dim: #888888; 
            --border: rgba(255, 255, 255, 0.1); --border-hover: rgba(255, 255, 255, 0.3);
            --accent: #ffffff; --transition: all 0.2s ease;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; width: 100vw; overflow: hidden;
            height: 100dvh; min-height: -webkit-fill-available; -webkit-font-smoothing: antialiased;
        }

        /* --- LOGIN SCREEN --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px;
        }
        .auth-box { width: 100%; max-width: 400px; text-align: center; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; height: 100%; background: var(--sidebar-bg);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            padding: 30px 20px; flex-shrink: 0; z-index: 100; position: relative;
        }
        .logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 50px; color: white; padding-left: 10px; }
        .menu-btn {
            background: transparent; border: none; color: var(--text-dim);
            text-align: left; padding: 15px; font-size: 0.95rem; font-weight: 500;
            cursor: pointer; border-radius: 8px; margin-bottom: 5px; 
            display: block; width: 100%; transition: var(--transition);
        }
        .menu-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-btn.active { background: rgba(255,255,255,0.1); color: white; font-weight: 600; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1; height: 100%; overflow-y: auto; 
            padding: 50px; padding-top: calc(50px + var(--safe-top));
            position: relative; z-index: 50;
        }
        .section { display: none; max-width: 900px; margin: 0 auto; animation: fadeIn 0.3s ease forwards; }
        .section.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI ELEMENTS --- */
        h2 { font-weight: 700; font-size: 2rem; margin: 0 0 10px 0; letter-spacing: -1px; }
        .subtitle { color: var(--text-dim); margin-bottom: 40px; font-weight: 400; font-size: 1rem; }
        input, select, textarea {
            background: var(--card-bg); border: 1px solid var(--border); color: white;
            padding: 16px; border-radius: 10px; width: 100%; margin-bottom: 20px;
            font-family: 'Inter', sans-serif; font-size: 16px; appearance: none;
        }
        button.action-btn { background: white; color: black; border: none; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-weight: 600; width: 100%; }
        button.secondary-btn { background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-top: 15px; }

        /* --- OC GRID --- */
        .oc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .oc-card { border: 1px solid var(--border); border-radius: 16px; background: var(--card-bg); cursor: pointer; overflow: hidden; height: 260px; display: flex; flex-direction: column; }
        .oc-card-img { height: 150px; background: #1a1a1a center/cover; }
