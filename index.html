<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #333333;
            --accent: #ffffff;
            --nav-height: 60px; /* New variable for mobile nav */
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR MENU (Desktop) */
        .sidebar {
            width: 250px;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0; /* Prevents sidebar from shrinking */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            text-align: left;
            padding: 15px 0;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .menu-btn:hover, .menu-btn.active {
            color: var(--text-main);
            font-weight: 600;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            /* Extra padding at bottom for mobile nav so content isn't hidden */
            padding-bottom: 80px; 
        }

        .section {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .section.active { display: block; }

        h2 { font-weight: 600; font-size: 2rem; margin-bottom: 10px; margin-top: 0; }
        .subtitle { color: var(--text-dim); margin-bottom: 30px; margin-top: 0; }

        /* INPUTS & BUTTONS */
        input, select, textarea {
            background: #111;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box; /* Fixes width issues */
            font-size: 16px; /* Prevents zoom on iPhone */
        }

        button.action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            width: 100%; /* Full width buttons on mobile look better */
            max-width: 200px;
        }
        
        button.action-btn:hover { background: #ddd; }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 50px;
            color: var(--text-dim);
            background: #0a0a0a;
        }

        .oc-card {
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0a0a0a;
        }
        
        .oc-pfp {
            width: 50px; height: 50px;
            background: #333;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* --- MOBILE RESPONSIVE MAGIC --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Stack vertically */
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: var(--nav-height);
                border-right: none;
                border-top: 1px solid var(--border);
                background: #000000;
                flex-direction: row; /* Horizontal menu */
                padding: 0;
                justify-content: space-around;
                align-items: center;
                z-index: 100;
            }

            .logo { display: none; } /* Hide logo on mobile to save space */

            .menu-btn {
                padding: 0;
                font-size: 0.8rem; /* Smaller text */
                text-align: center;
                flex: 1;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .main-content {
                padding: 20px;
                padding-bottom: 90px; /* More space for bottom bar */
            }

            h2 { font-size: 1.8rem; }
            
            /* Make buttons full width on phone */
            button.action-btn { max-width: 100%; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- SIDEBAR / BOTTOM NAV -->
    <div class="sidebar">
        <div class="logo">writer.</div>
        <!-- Shortened names for mobile space -->
        <button class="menu-btn active" onclick="showSection('home')">Home</button>
        <button class="menu-btn" onclick="showSection('dictionary')">Dict.</button>
        <button class="menu-btn" onclick="showSection('oc-creator')">OCs</button>
        <button class="menu-btn" onclick="showSection('prompts')">Prompts</button>
        <button class="menu-btn" onclick="showSection('names')">Names</button>
    </div>

    <!-- CONTENT -->
    <div class="main-content">
        
        <!-- HOME -->
        <div id="home" class="section active">
            <h2>Welcome.</h2>
            <p class="subtitle">Select a tool to begin writing.</p>
        </div>

        <!-- DICTIONARY -->
        <div id="dictionary" class="section">
            <h2>Dictionary</h2>
            <p class="subtitle">Find definitions and synonyms.</p>
            <input type="text" id="dict-search" placeholder="Type a word...">
            <button class="action-btn" onclick="searchWord()">Search</button>
            <div id="dict-result" class="result-box">Results...</div>
        </div>

        <!-- OC CREATOR -->
        <div id="oc-creator" class="section">
            <h2>OC Vault</h2>
            <p class="subtitle">Create and store characters.</p>
            
            <div style="background: #111; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                <input type="text" id="oc-name" placeholder="Name">
                <input type="text" id="oc-role" placeholder="Role (e.g. Protagonist)">
                <textarea id="oc-desc" rows="3" placeholder="Description..."></textarea>
                <button class="action-btn" onclick="saveOC()">Save Character</button>
            </div>

            <div id="oc-list"></div>
        </div>

        <!-- PROMPTS -->
        <div id="prompts" class="section">
            <h2>Prompt Gen</h2>
            <p class="subtitle">Break your writer's block.</p>
            <select id="prompt-genre">
                <option value="romance">Romance</option>
                <option value="horror">Horror</option>
                <option value="comedy">Comedy</option>
                <option value="fantasy">Fantasy</option>
            </select>
            <button class="action-btn" onclick="generatePrompt()">Generate</button>
            <div id="prompt-result" class="result-box">Prompt...</div>
        </div>

        <!-- NAMES -->
        <div id="names" class="section">
            <h2>Name Gen</h2>
            <p class="subtitle">Find the perfect name.</p>
            <select id="name-gender">
                <option value="feminine">Feminine</option>
                <option value="masculine">Masculine</option>
                <option value="neutral">Neutral</option>
            </select>
            <select id="name-count">
                <option value="1">1 Name</option>
                <option value="5">5 Names</option>
                <option value="10">10 Names</option>
            </select>
            <button class="action-btn" onclick="generateNames()">Generate</button>
            <div id="name-result" class="result-box">Names...</div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // NAVIGATION
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            
            // Highlight the correct button even if text is different (simple match)
            event.target.classList.add('active');
        }

        // DICTIONARY
        async function searchWord() {
            const word = document.getElementById('dict-search').value;
            const resultBox = document.getElementById('dict-result');
            if(!word) return;
            resultBox.innerHTML = "Searching...";
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const data = await response.json();
                if (data.title === "No Definitions Found") {
                    resultBox.innerHTML = "Word not found.";
                } else {
                    const def = data[0].meanings[0].definitions[0].definition;
                    resultBox.innerHTML = `<strong>${word}</strong><br><br>${def}`;
                }
            } catch (error) { resultBox.innerHTML = "Error."; }
        }

        // OC CREATOR (Load saved OCs on start)
        window.onload = function() {
            const savedOCs = JSON.parse(localStorage.getItem('myOCs') || '[]');
            savedOCs.forEach(oc => renderOCCard(oc));
        };

        function saveOC() {
            const name = document.getElementById('oc-name').value;
            const role = document.getElementById('oc-role').value;
            const desc = document.getElementById('oc-desc').value;
            
            if(!name) return alert("Name is required!");

            const newOC = { name, role, desc };
            renderOCCard(newOC);

            // SAVE TO LOCAL STORAGE
            const currentOCs = JSON.parse(localStorage.getItem('myOCs') || '[]');
            currentOCs.push(newOC);
            localStorage.setItem('myOCs', JSON.stringify(currentOCs));

            // Clear inputs
            document.getElementById('oc-name').value = '';
            document.getElementById('oc-role').value = '';
            document.getElementById('oc-desc').value = '';
        }

        function renderOCCard(oc) {
            const ocList = document.getElementById('oc-list');
            const card = document.createElement('div');
            card.className = 'oc-card';
            card.innerHTML = `
                <div class="oc-pfp"></div>
                <div>
                    <h3 style="margin: 0;">${oc.name}</h3>
                    <small style="color: #888;">${oc.role}</small>
                    <p style="margin: 5px 0 0 0; font-size: 0.9rem;">${oc.desc}</p>
                </div>
            `;
            ocList.prepend(card);
        }

        // PROMPTS
        const prompts = {
            romance: ["They were rivals in business, but stuck in an elevator.", "She forgot her umbrella, he offered his.", "A letter meant for someone else arrives at her door."],
            horror: ["The reflection in the mirror blinked.", "The GPS led them to a road that wasn't on the map.", "Every night, the door opens exactly one inch."],
            comedy: ["A wizard tries to live a normal life as an accountant.", "He accidentally joined a cult thinking it was a yoga class.", "Her cat started talking, but only complains about the food."],
            fantasy: ["The sword was too heavy for the hero, but light for the baker.", "Dragons are actually just very big, scaly pigeons.", "The king's crown was stolen by a gust of wind."]
        };

        function generatePrompt() {
            const genre = document.getElementById('prompt-genre').value;
            const list = prompts[genre];
            const random = list[Math.floor(Math.random() * list.length)];
            document.getElementById('prompt-result').innerText = random;
        }

        // NAMES
        const namesDB = {
            feminine: ["Elara", "Seraphina", "Luna", "Iris", "Freya", "Nova", "Aria"],
            masculine: ["Atlas", "Orion", "Silas", "Ezra", "Felix", "Jasper", "Kai"],
            neutral: ["Rowan", "Sage", "River", "Phoenix", "Quinn", "Alex", "Jordan"]
        };

        function generateNames() {
            const gender = document.getElementById('name-gender').value;
            const count = parseInt(document.getElementById('name-count').value);
            const list = namesDB[gender];
            let result = "";
            for(let i=0; i<count; i++) {
                result += list[Math.floor(Math.random() * list.length)] + (i < count-1 ? ", " : "");
            }
            document.getElementById('name-result').innerText = result;
        }
    </script>
</body>
</html>
