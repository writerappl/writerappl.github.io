<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Writer V8.0 (Profiles)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES --- */
        :root { --bg:#050505; --sidebar:#000; --card:#0a0a0a; --text:#fff; --dim:#888; --border:rgba(255,255,255,0.1); --safe-top:env(safe-area-inset-top,20px); --safe-bottom:env(safe-area-inset-bottom,20px); }
        * { box-sizing:border-box; outline:none; -webkit-tap-highlight-color:transparent; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; display:flex; height:100dvh; overflow:hidden; }

        /* --- LAYOUT --- */
        .sidebar { width:260px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:30px 20px; z-index:100; }
        .logo { font-size:1.5rem; font-weight:700; margin-bottom:40px; padding-left:10px; }
        .menu-btn { background:transparent; border:none; color:var(--dim); text-align:left; padding:15px; width:100%; cursor:pointer; border-radius:8px; margin-bottom:5px; font-size:0.95rem; font-weight:500; display:flex; align-items:center; gap:10px; }
        .menu-btn:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .menu-btn.active { background:rgba(255,255,255,0.1); color:#fff; font-weight:600; }
        
        .main-content { flex:1; overflow-y:auto; padding:50px; padding-top:calc(50px + var(--safe-top)); }
        .section { display:none; max-width:800px; margin:0 auto; animation:fadeIn 0.3s ease; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* --- COMPONENTS --- */
        input, textarea { background:var(--card); border:1px solid var(--border); color:#fff; padding:15px; border-radius:10px; width:100%; margin-bottom:15px; font-family:'Inter'; font-size:16px; }
        button.btn { background:#fff; color:#000; border:none; padding:12px 25px; border-radius:50px; font-weight:600; cursor:pointer; width:100%; }
        button.btn-sec { background:rgba(255,255,255,0.05); color:#ccc; border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-size:0.85rem; cursor:pointer; margin-top:10px; }

        /* --- PROFILE --- */
        .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:40px; }
        .avatar-lg { width:80px; height:80px; border-radius:50%; background:#222 center/cover; border:2px solid var(--border); }
        .avatar-sm { width:24px; height:24px; border-radius:50%; background:#333 center/cover; display:inline-block; }

        /* --- AUTH SCREEN --- */
        #auth-screen { position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px; }
        
        /* --- MOBILE --- */
        @media(max-width:768px) {
            body { flex-direction:column; }
            .sidebar { width:100%; height:auto; position:fixed; bottom:0; flex-direction:row; padding:10px 10px calc(10px + var(--safe-bottom)); background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--border); border-right:none; justify-content:space-evenly; }
            .logo { display:none; }
            .menu-btn { padding:8px; flex:1; justify-content:center; font-size:0.75rem; text-align:center; }
            .main-content { padding:20px; padding-bottom:100px; }
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <h1 style="margin-bottom:10px;">writer.</h1>
        <p style="color:#888; margin-bottom:30px;">Login to access your world.</p>
        <div style="width:100%; max-width:320px;">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="handleAuth()">Enter</button>
            <p id="auth-msg" style="color:#ff5555; font-size:0.9rem; margin-top:15px; text-align:center;"></p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">writer.</div>
        <button class="menu-btn active" onclick="nav('home')">Home</button>
        <button class="menu-btn" onclick="nav('ocs')">Characters</button>
        <button class="menu-btn" onclick="nav('profile')">
            <div id="nav-avatar" class="avatar-sm"></div> <span id="nav-username">Profile</span>
        </button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        
        <!-- HOME -->
        <div id="home" class="section active">
            <h2>Dashboard</h2>
            <div style="background:linear-gradient(145deg,#111,#0a0a0a); padding:30px; border-radius:16px; border:1px solid var(--border);">
                <p style="font-size:1.2rem; font-weight:300; margin:0 0 10px; color:#eee;">"The scariest moment is always just before you start."</p>
                <small style="color:var(--dim);">— Stephen King</small>
            </div>
        </div>

        <!-- PROFILE -->
        <div id="profile" class="section">
            <h2>Your Profile</h2>
            <div class="profile-header">
                <div id="profile-avatar" class="avatar-lg"></div>
                <div>
                    <h3 id="profile-name" style="margin:0 0 5px;">User</h3>
                    <p id="profile-email" style="margin:0; color:var(--dim); font-size:0.9rem;">...</p>
                </div>
            </div>
            
            <div style="background:#111; padding:25px; border-radius:16px; border:1px solid var(--border);">
                <h4 style="margin-top:0;">Edit Profile</h4>
                <label style="color:#888; font-size:0.8rem;">Username</label>
                <input type="text" id="edit-username" placeholder="Choose a username">
                
                <label style="color:#888; font-size:0.8rem;">Avatar Image</label>
                <input type="file" id="edit-avatar" accept="image/*" style="padding:10px 0; background:transparent; border:none;">
                
                <button class="btn" onclick="updateProfile()">Save Changes</button>
                <button class="btn-sec" onclick="handleLogout()" style="color:#ff5555; border-color:#ff555533; width:100%; margin-top:20px;">Log Out</button>
            </div>
        </div>

        <!-- CHARACTERS (Simplified for brevity, fully functional) -->
        <div id="ocs" class="section">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>Characters</h2>
                <button class="btn" onclick="openOcForm()" style="width:auto; padding:10px 20px;">+ New</button>
            </div>
            <div id="oc-list" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:15px;"></div>
        </div>
        
        <!-- OC FORM (Hidden) -->
        <div id="oc-form" style="display:none; position:fixed; inset:0; background:#000; z-index:200; padding:20px; overflow-y:auto;">
            <div style="max-width:600px; margin:0 auto;">
                <h2>New Character</h2>
                <input type="text" id="oc-name" placeholder="Name">
                <input type="text" id="oc-role" placeholder="Role">
                <textarea id="oc-desc" rows="3" placeholder="Description"></textarea>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="saveOc()">Save</button>
                    <button class="btn-sec" onclick="document.getElementById('oc-form').style.display='none'">Cancel</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = 'https://icotzotkvdzytrrxtudq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imljb3R6b3RrdmR6eXRycnh0dWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3OTg1MDksImV4cCI6MjA4MzM3NDUwOX0.MhnSU6RroQKSOykB3LogU16hKw8Y56kmaHDc_BfYyQg';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let user = null;

        // --- 2. AUTH & INIT ---
        async function checkSession() {
            const { data } = await db.auth.getSession();
            if (data.session) {
                user = data.session.user;
                document.getElementById('auth-screen').style.display = 'none';
                loadProfile();
                loadOcs();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        }
        
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            msg.innerText = "Loading...";

            // Login
            let { error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                // If login fails, try signup
                let { error: upError } = await db.auth.signUp({ email, password });
                if(upError) msg.innerText = upError.message;
                else msg.innerText = "Account created! Logging in...";
            } else {
                location.reload();
            }
        }

        async function handleLogout() {
            await db.auth.signOut();
            location.reload();
        }

        // --- 3. PROFILES ---
        async function loadProfile() {
            // Get profile data
            let { data } = await db.from('profiles').select('*').eq('id', user.id).single();
            
            // If no profile exists yet (legacy user), create one locally
            if(!data) {
                await db.from('profiles').insert([{ id: user.id, username: user.email.split('@')[0] }]);
                data = { username: user.email.split('@')[0], avatar_url: null };
            }

            // Update UI
            document.getElementById('profile-email').innerText = user.email;
            document.getElementById('profile-name').innerText = data.username || "Writer";
            document.getElementById('nav-username').innerText = data.username || "Profile";
            document.getElementById('edit-username').value = data.username || "";

            if(data.avatar_url) {
                document.getElementById('profile-avatar').style.backgroundImage = `url('${data.avatar_url}')`;
                document.getElementById('nav-avatar').style.backgroundImage = `url('${data.avatar_url}')`;
            }
        }

        async function updateProfile() {
            const username = document.getElementById('edit-username').value;
            const file = document.getElementById('edit-avatar').files[0];
            let avatarUrl = null;

            if(file) {
                avatarUrl = await new Promise(r => { const rd = new FileReader(); rd.onload=e=>r(e.target.result); rd.readAsDataURL(file); });
            }

            const updates = { 
                id: user.id, 
                username: username, 
                updated_at: new Date() 
            };
            if(avatarUrl) updates.avatar_url = avatarUrl;

            const { error } = await db.from('profiles').upsert(updates);
            if(error) alert("Error updating profile");
            else {
                alert("Saved!");
                loadProfile(); // Refresh UI
            }
        }

        // --- 4. DATA (Characters) ---
        async function loadOcs() {
            const { data } = await db.from('characters').select('*');
            const list = document.getElementById('oc-list');
            list.innerHTML = "";
            (data||[]).forEach(oc => {
                const el = document.createElement('div');
                el.style.cssText = "background:#111; border:1px solid #333; border-radius:10px; padding:15px; height:150px;";
                el.innerHTML = `<h3>${oc.name}</h3><small style='color:#888'>${oc.role}</small>`;
                list.appendChild(el);
            });
        }

        async function saveOc() {
            const name = document.getElementById('oc-name').value;
            const role = document.getElementById('oc-role').value;
            const desc = document.getElementById('oc-desc').value;
            
            await db.from('characters').insert([{ user_id: user.id, name, role, "desc": desc }]);
            document.getElementById('oc-form').style.display='none';
            loadOcs();
        }

        // --- UI UTILS ---
        function nav(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        function openOcForm() { document.getElementById('oc-form').style.display='block'; }

        window.onload = checkSession;
    </script>
</body>
</html>
