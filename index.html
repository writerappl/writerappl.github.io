<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer V3.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #333333;
            --highlight: #ffffff;
            --nav-height: 60px;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #000;
            z-index: 500; /* Super high z-index to stay on top */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -1px;
            color: white;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            text-align: left;
            padding: 15px 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
        }

        .menu-btn:hover { background: #111; color: white; }
        .menu-btn.active { color: white; font-weight: 600; background: #222; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            padding-bottom: 100px;
            position: relative;
        }

        /* --- SECTION FIX --- */
        .section {
            display: none; /* Default state */
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
            pointer-events: none; /* INVISIBLE LAYERS CAN'T BE CLICKED */
        }
        
        .section.active { 
            display: block; 
            pointer-events: auto; /* CLICKABLE WHEN VISIBLE */
        }

        h2 { font-weight: 600; font-size: 2rem; margin: 0 0 10px 0; }
        .subtitle { color: var(--text-dim); margin: 0 0 30px 0; font-weight: 300; }

        /* --- INPUTS & UI --- */
        input, select, textarea {
            background: #111;
            border: 1px solid var(--border);
            color: white;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            font-size: 16px;
        }

        button.action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            max-width: 200px;
            transition: opacity 0.2s;
        }
        button.action-btn:active { opacity: 0.7; }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 50px;
            color: #ccc;
            background: #0a0a0a;
            line-height: 1.5;
        }

        /* --- OC GRID LAYOUT --- */
        .oc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .oc-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0a0a0a;
            cursor: pointer;
            transition: transform 0.2s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 250px;
        }
        .oc-card:hover { transform: translateY(-3px); border-color: #666; }
