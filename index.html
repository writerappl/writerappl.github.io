<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer V2.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #333333;
            --highlight: #ffffff;
            --nav-height: 60px;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #000;
            z-index: 100; /* Ensure it stays on top */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -1px;
            color: white;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            text-align: left;
            padding: 15px 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
        }

        .menu-btn:hover { background: #111; color: white; }
        .menu-btn.active { color: white; font-weight: 600; background: #222; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            padding-bottom: 100px;
            position: relative; /* Context for absolute positioning */
        }

        .section {
            display: none; /* Completely removes from layout */
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        
        .section.active { display: block; }

        h2 { font-weight: 600; font-size: 2rem; margin: 0 0 10px 0; }
        .subtitle { color: var(--text-dim); margin: 0 0 30px 0; font-weight: 300; }

        /* --- INPUTS & UI --- */
        input, select, textarea {
            background: #111;
            border: 1px solid var(--border);
            color: white;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            font-size: 16px;
        }

        button.action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            max-width: 200px;
            transition: opacity 0.2s;
        }
        button.action-btn:active { opacity: 0.7; }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 50px;
            color: #ccc;
            background: #0a0a0a;
            line-height: 1.5;
        }

        /* --- OC CARDS --- */
        .oc-card {
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0a0a0a;
            cursor: pointer;
            transition: background 0.2s;
        }
        .oc-card:hover { background: #1a1a1a; }
        
        .oc-pfp {
            width: 50px; height: 50px;
            background: #333;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* --- MODAL (POPUP) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: #666; font-size: 1.5rem;
            cursor: pointer;
        }

        /* --- MOBILE STYLES --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            
            .sidebar {
                position: fixed;
                bottom: 0; left: 0;
                width: 100%;
                height: var(--nav-height);
                border-right: none;
                border-top: 1px solid var(--border);
                flex-direction: row;
                padding: 0;
                justify-content: space-around;
            }

            .logo { display: none; }

            .menu-btn {
                padding: 0;
                font-size: 0.75rem;
                flex: 1;
                text-align: center;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 0;
            }
            .menu-btn.active { border-top: 2px solid white; background: none; }

            .main-content { padding: 20px; padding-bottom: 90px; }
            h2 { font-size: 1.8rem; }
            button.action-btn { max-width: 100%; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- NAV -->
    <div class="sidebar">
        <div class="logo">writer.</div>
        <button class="menu-btn active" onclick="showSection('home')">Home</button>
        <button class="menu-btn" onclick="showSection('dictionary')">Dict</button>
        <button class="menu-btn" onclick="showSection('oc-creator')">OCs</butto
