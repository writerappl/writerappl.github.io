<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer V3.3 (Fixed)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLES --- */
        :root { --bg-color: #000000; --text-main: #ffffff; --text-dim: #888888; --border: #333333; }

        body {
            margin: 0; background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        .sidebar {
            width: 250px; border-right: 1px solid var(--border); padding: 20px;
            display: flex; flex-direction: column; flex-shrink: 0; background: #000;
            position: relative; z-index: 9999; /* TOP LAYER */
        }

        .logo { font-size: 1.5rem; font-weight: 600; margin-bottom: 40px; color: white; }

        .menu-btn {
            background: none; border: none; color: var(--text-dim); text-align: left;
            padding: 15px 10px; font-size: 1rem; cursor: pointer; border-radius: 8px;
            pointer-events: auto; /* FORCE CLICKABLE */
        }
        .menu-btn:hover { background: #111; color: white; }
        .menu-btn.active { color: white; font-weight: 600; background: #222; }

        .main-content {
            flex: 1; padding: 40px; overflow-y: auto; padding-bottom: 100px; position: relative;
            z-index: 1; /* LOWER LAYER */
        }

        /* --- THE SECTION LOGIC --- */
        .section {
            display: none; /* Hide by default */
        }
        
        .section.active { 
            display: block; /* Show only when active */
        }

        /* --- UI ELEMENTS --- */
        h2 { font-weight: 600; font-size: 2rem; margin: 0 0 10px 0; }
        .subtitle { color: var(--text-dim); margin: 0 0 30px 0; }

        input, select, textarea {
            background: #111; border: 1px solid var(--border); color: white;
            padding: 14px; border-radius: 8px; width: 100%; margin-bottom: 15px;
            font-family: 'Inter', sans-serif; box-sizing: border-box; font-size: 16px;
        }

        button.action-btn {
            background: white; color: black; border: none; padding: 12px 25px;
            border-radius: 30px; cursor: pointer; font-weight: 600; width: 100%; max-width: 200px;
        }

        .result-box {
            margin-top: 20px; padding: 20px; border: 1px solid var(--border);
            border-radius: 8px; min-height: 50px; color: #ccc; background: #0a0a0a;
        }

        .oc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        
        .oc-card {
            border: 1px solid var(--border); border-radius: 12px; background: #0a0a0a;
            cursor: pointer; overflow: hidden; display: flex; flex-direction: column; height: 250px;
        }
        .oc-card-img { width: 100%; height: 150px; background-color: #222; background-size: cover; background-position: center; }
        .oc-card-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: #111; border: 1px solid #333; border-radius: 12px;
            width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .modal-header-img { width: 100%; height: 200px; background-color: #222; background-size: cover; background-position: center; }
        .modal-body { padding: 30px; }
        .close-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); 
            border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
                border-right: none; border-top: 1px solid var(--border); flex-direction: row; padding: 0; justify-content: space-around;
            }
            .logo { display: none; }
            .menu-btn { padding: 0; font-size: 0.75rem; flex: 1; text-align: center; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 0; }
            .menu-btn.active { border-top: 2px solid white; background: none; }
            .main-content { padding: 20px; padding-bottom: 90px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">writer.</div>
        <button class="menu-btn active" onclick="showSection('home')">Home</button>
        <button class="menu-btn" onclick="showSection('dictionary')">Dict</button>
        <button class="menu-btn" onclick="showSection('oc-creator')">OCs</button>
        <button class="menu-btn" onclick="showSection('prompts')">Prompts</button>
        <button class="menu-btn" onclick="showSection('names')">Names</button>
    </div>

    <div class="main-content">
        
        <div id="home" class="section active">
            <h2>Dashboard</h2>
            <p class="subtitle">Welcome back.</p>
            <div style="background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222;">
                <h3 style="margin-top: 0; color: #888; font-size: 0.9rem;">DAILY INSPIRATION</h3>
                <p style="font-size: 1.2rem; font-style: italic;">"There is no greater agony than bearing an untold story inside you."</p>
            </div>
        </div>

        <div id="dictionary" class="section">
            <h2>Dictionary</h2>
            <input type="text" id="dict-search" placeholder="Type a word...">
            <button class="action-btn" onclick="searchWord()">Search</button>
            <div id="dict-result" class="result-box">Definitions...</div>
        </div>

        <div id="oc-creator" class="section">
            <h2>OC Vault</h2>
            <button class="action-btn" onclick="toggleOCForm()" style="margin-bottom: 20px;">+ New Character</button>
            
            <div id="oc-form" style="display: none; background: #111; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #333;">
                <input type="text" id="oc-name" placeholder="Name">
                <input type="file" id="oc-image" accept="image/*" style="margin-bottom: 10px;">
                <input type="text" id="oc-role" placeholder="Role">
                <input type="text" id="oc-age" placeholder="Age">
                <input type="text" id="oc-gender" placeholder="Gender">
                <textarea id="oc-desc" rows="2" placeholder="Appearance"></textarea>
                <textarea id="oc-personality" rows="2" placeholder="Personality"></textarea>
                <textarea id="oc-goals" rows="2" placeholder="Goals"></textarea>
                <textarea id="oc-lore" rows="2" placeholder="Backstory"></textarea>
                <button class="action-btn" onclick="processAndSaveOC()">Save</button>
            </div>
            <div id="oc-list" class="oc-grid"></div>
        </div>

        <div id="prompts" class="section">
            <h2>Prompts</h2>
            <select id="prompt-genre">
                <option value="romance">Romance</option>
                <option value="horror">Horror</option>
                <option value="fantasy">Fantasy</option>
            </select>
            <button class="action-btn" onclick="generatePrompt()">Generate</button>
            <div id="prompt-result" class="result-box">...</div>
        </div>

        <div id="names" class="section">
            <h2>Names</h2>
            <select id="name-gender"><option value="feminine">Feminine</option><option value="masculine">Masculine</option></select>
            <button class="action-btn" onclick="generateNames()">Generate</button>
            <div id="name-result" class="result-box">...</div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="oc-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModalBtn()">×</button>
            <div id="modal-img-header" class="modal-header-img"></div>
            <div class="modal-body">
                <h2 id="modal-name"></h2>
                <p id="modal-role" style="color:#888"></p>
                <p><strong>Age:</strong> <span id="modal-age"></span></p>
                <p><strong>Desc:</strong> <span id="modal-desc"></span></p>
                <p><strong>Lore:</strong> <span id="modal-lore"></span></p>
                <button class="action-btn" onclick="deleteOC()" style="background:#300; color:#f88; margin-top:20px">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(event) event.target.classList.add('active');
        }

        function toggleOCForm() {
            const f = document.getElementById('oc-form');
            f.style.display = f.style.display === 'none' ? 'block' : 'none';
        }

            const list = document.getElementById
