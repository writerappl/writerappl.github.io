<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Writer V8.2 (Refined)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES --- */
        :root { --bg:#050505; --sidebar:#000; --card:#0a0a0a; --text:#fff; --dim:#888; --border:rgba(255,255,255,0.1); --safe-top:env(safe-area-inset-top,20px); --safe-bottom:env(safe-area-inset-bottom,20px); }
        * { box-sizing:border-box; outline:none; -webkit-tap-highlight-color:transparent; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; display:flex; height:100dvh; overflow:hidden; }

        /* --- LAYOUT --- */
        .sidebar { width:260px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:30px 20px; z-index:100; }
        .logo { font-size:1.5rem; font-weight:700; margin-bottom:40px; padding-left:10px; }
        .nav-items { flex:1; display:flex; flex-direction:column; gap:5px; }
        .profile-btn-container { margin-top:auto; padding-top:20px; border-top:1px solid var(--border); }
        .menu-btn { background:transparent; border:none; color:var(--dim); text-align:left; padding:12px 15px; width:100%; cursor:pointer; border-radius:8px; font-size:0.95rem; font-weight:500; display:flex; align-items:center; gap:10px; transition:0.2s; }
        .menu-btn:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .menu-btn.active { background:rgba(255,255,255,0.1); color:#fff; font-weight:600; }
        
        .main-content { flex:1; overflow-y:auto; padding:50px; padding-top:calc(50px + var(--safe-top)); }
        .section { display:none; max-width:800px; margin:0 auto; animation:fadeIn 0.3s ease; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* --- COMPONENTS --- */
        input, textarea, select { background:var(--card); border:1px solid var(--border); color:#fff; padding:15px; border-radius:10px; width:100%; margin-bottom:15px; font-family:'Inter'; font-size:16px; appearance:none; }
        button.btn { background:#fff; color:#000; border:none; padding:12px 25px; border-radius:50px; font-weight:600; cursor:pointer; width:100%; transition:0.2s; }
        button.btn:hover { transform:translateY(-2px); }
        button.btn-sec { background:rgba(255,255,255,0.05); color:#ccc; border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-size:0.85rem; cursor:pointer; margin-top:10px; }
        .result-box { margin-top:20px; padding:20px; border:1px solid var(--border); border-radius:10px; background:var(--card); min-height:60px; color:#ddd; position:relative; }

        /* --- PROFILE --- */
        .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:40px; }
        .avatar-lg { width:80px; height:80px; border-radius:50%; background:#222 center/cover; border:2px solid var(--border); }
        .avatar-sm { width:24px; height:24px; border-radius:50%; background:#333 center/cover; display:inline-block; }

        /* --- AUTH SCREEN --- */
        #auth-screen { position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px; }

        /* --- OC MODAL --- */
        #oc-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center; padding:20px; backdrop-filter:blur(5px); }
        .modal-content { background:#0a0a0a; border:1px solid #333; border-radius:16px; width:100%; max-width:600px; max-height:85vh; overflow-y:auto; padding:30px; position:relative; }
        .close-btn { position:absolute; top:15px; right:15px; width:30px; height:30px; background:rgba(255,255,255,0.1); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        
        /* --- MOBILE --- */
        @media(max-width:768px) {
            body { flex-direction:column; }
            .sidebar { width:100%; height:auto; position:fixed; bottom:0; padding:10px 10px calc(10px + var(--safe-bottom)); background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--border); border-right:none; display:flex; flex-direction:row; }
            .nav-items { flex-direction:row; width:100%; justify-content:space-between; }
            .profile-btn-container { display:block; border:none; padding:0; margin:0; width:auto; }
            .logo { display:none; }
            .menu-btn { padding:8px; justify-content:center; font-size:0.75rem; text-align:center; flex-direction:column; gap:4px; }
            .main-content { padding:20px; padding-bottom:100px; }
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <h1 style="margin-bottom:10px;">writer.</h1>
        <p style="color:#888; margin-bottom:30px;">Login to access your world.</p>
        <div style="width:100%; max-width:320px;">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="handleAuth()">Enter</button>
            <p id="auth-msg" style="color:#ff5555; font-size:0.9rem; margin-top:15px; text-align:center;"></p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">writer.</div>
        <div class="nav-items">
            <button class="menu-btn active" onclick="nav('home')">Home</button>
            <button class="menu-btn" onclick="nav('ocs')">Characters</button>
            <button class="menu-btn" onclick="nav('dictionary')">Dict</button>
            <button class="menu-btn" onclick="nav('prompts')">Prompts</button>
            <button class="menu-btn" onclick="nav('names')">Names</button>
        </div>
        <div class="profile-btn-container">
            <button class="menu-btn" onclick="nav('profile')">
                <div id="nav-avatar" class="avatar-sm"></div> <span id="nav-username">Profile</span>
            </button>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        
        <!-- HOME -->
        <div id="home" class="section active">
            <h2>Dashboard</h2>
            <div style="background:linear-gradient(145deg,#111,#0a0a0a); padding:30px; border-radius:16px; border:1px solid var(--border);">
                <p style="font-size:1.2rem; font-weight:300; margin:0 0 10px; color:#eee;">"The scariest moment is always just before you start."</p>
                <small style="color:var(--dim);">— Stephen King</small>
            </div>
        </div>

        <!-- PROFILE -->
        <div id="profile" class="section">
            <h2>Your Profile</h2>
            <div class="profile-header">
                <div id="profile-avatar" class="avatar-lg"></div>
                <div>
                    <h3 id="profile-name" style="margin:0 0 5px;">User</h3>
                    <p id="profile-email" style="margin:0; color:var(--dim); font-size:0.9rem;">...</p>
                </div>
            </div>
            <div style="background:#111; padding:25px; border-radius:16px; border:1px solid var(--border);">
                <h4 style="margin-top:0;">Edit Profile</h4>
                <label style="color:#888; font-size:0.8rem;">Username</label>
                <input type="text" id="edit-username" placeholder="Choose a username">
                <label style="color:#888; font-size:0.8rem;">Avatar Image</label>
                <input type="file" id="edit-avatar" accept="image/*" style="padding:10px 0; background:transparent; border:none;">
                <button class="btn" onclick="updateProfile()">Save Changes</button>
                <button class="btn-sec" onclick="handleLogout()" style="color:#ff5555; border-color:#ff555533; width:100%; margin-top:20px;">Log Out</button>
            </div>
        </div>

        <!-- CHARACTERS -->
        <div id="ocs" class="section">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>Characters</h2>
                <button class="btn" onclick="openOcForm()" style="width:auto; padding:10px 20px;">+ New</button>
            </div>
            <div id="oc-list" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:15px;"></div>
        </div>

        <!-- DICTIONARY -->
        <div id="dictionary" class="section">
            <h2>Dictionary</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="dict-search" placeholder="Type a word..." style="margin-bottom:0;" onkeypress="if(event.key==='Enter') searchWord()">
                <button class="btn" onclick="searchWord()" style="width:auto;">Search</button>
            </div>
            <div id="dict-result" class="result-box"></div>
        </div>

        <!-- PROMPTS -->
        <div id="prompts" class="section">
            <h2>Prompts</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <select id="prompt-genre" style="margin-bottom:0;">
                    <option value="romance">Romance</option>
                    <option value="horror">Horror</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="scifi">Sci-Fi</option>
                </select>
                <button class="btn" onclick="generatePrompt()">Generate</button>
            </div>
            <div class="result-box">
                <div id="prompt-result" style="font-size:1.2rem;">Select a genre...</div>
                <button class="btn-sec" onclick="generatePrompt()">Re-Roll ↻</button>
            </div>
        </div>

        <!-- NAMES -->
        <div id="names" class="section">
            <h2>Name Generator</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <select id="name-gender" style="margin-bottom:0; flex:2;">
                    <option value="neutral">Neutral</option>
                    <option value="fem">Feminine</option>
                    <option value="masc">Masculine</option>
                </select>
                <select id="name-count" style="margin-bottom:0; flex:1;">
                    <option value="1">1</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
                <button class="btn" onclick="generateNames()" style="flex:2;">Generate</button>
            </div>
            <div class="result-box">
                <div id="name-result">Names appear here...</div>
                <button class="btn-sec" onclick="generateNames()">Re-Roll ↻</button>
            </div>
        </div>
        
        <!-- OC FORM (Create) -->
        <div id="oc-form" style="display:none; position:fixed; inset:0; background:#000; z-index:200; padding:20px; overflow-y:auto;">
            <div style="max-width:600px; margin:0 auto;">
                <h2>New Character</h2>
                <input type="text" id="create-name" placeholder="Name">
                <input type="text" id="create-role" placeholder="Role">
                <textarea id="create-desc" rows="3" placeholder="Description"></textarea>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="saveOc()">Save</button>
                    <button class="btn-sec" onclick="document.getElementById('oc-form').style.display='none'">Cancel</button>
                </div>
            </div>
        </div>

        <!-- OC MODAL (View/Delete) -->
        <div id="oc-modal">
            <div class="modal-content">
                <div class="close-btn" onclick="document.getElementById('oc-modal').style.display='none'">×</div>
                <h2 id="modal-title">Name</h2>
                <p id="modal-role" style="color:#888; margin-top:-10px;">Role</p>
                <p id="modal-desc" style="line-height:1.6; color:#ccc;"></p>
                <button class="btn-sec" onclick="deleteOc()" style="color:#ff5555; border-color:#ff555533; width:100%; margin-top:30px;">Delete Character</button>
            </div>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = 'https://icotzotkvdzytrrxtudq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imljb3R6b3RrdmR6eXRycnh0dWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3OTg1MDksImV4cCI6MjA4MzM3NDUwOX0.MhnSU6RroQKSOykB3LogU16hKw8Y56kmaHDc_BfYyQg';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let user = null;
        let currentOcId = null;

        // --- AUTH ---
        async function checkSession() {
            const { data } = await db.auth.getSession();
            if (data.session) {
                user = data.session.user;
                document.getElementById('auth-screen').style.display = 'none';
                loadProfile();
                loadOcs();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        }
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let { error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                let { error: upError } = await db.auth.signUp({ email, password });
                if(upError) document.getElementById('auth-msg').innerText = upError.message;
                else location.reload();
            } else location.reload();
        }
        async function handleLogout() { await db.auth.signOut(); location.reload(); }

        // --- PROFILES ---
        async function loadProfile() {
            let { data } = await db.from('profiles').select('*').eq('id', user.id).single();
            if(!data) {
                await db.from('profiles').insert([{ id: user.id, username: user.email.split('@')[0] }]);
                data = { username: user.email.split('@')[0], avatar_url: null };
            }
            document.getElementById('profile-email').innerText = user.email;
            document.getElementById('profile-name').innerText = data.username || "Writer";
            document.getElementById('nav-username').innerText = data.username || "Profile";
            document.getElementById('edit-username').value = data.username || "";
            if(data.avatar_url) {
                document.getElementById('profile-avatar').style.backgroundImage = `url('${data.avatar_url}')`;
                document.getElementById('nav-avatar').style.backgroundImage = `url('${data.avatar_url}')`;
            }
        }
        async function updateProfile() {
            const username = document.getElementById('edit-username').value;
            const file = document.getElementById('edit-avatar').files[0];
            let avatarUrl = null;
            if(file) avatarUrl = await new Promise(r => { const rd = new FileReader(); rd.onload=e=>r(e.target.result); rd.readAsDataURL(file); });
            const updates = { id: user.id, username: username, updated_at: new Date() };
            if(avatarUrl) updates.avatar_url = avatarUrl;
            await db.from('profiles').upsert(updates);
            alert("Saved!"); loadProfile();
        }

        // --- CHARACTERS ---
        async function loadOcs() {
            const { data } = await db.from('characters').select('*');
            const list = document.getElementById('oc-list');
            list.innerHTML = "";
            (data||[]).forEach(oc => {
                const el = document.createElement('div');
                el.style.cssText = "background:#111; border:1px solid #333; border-radius:10px; padding:15px; height:150px; cursor:pointer;";
                el.innerHTML = `<h3>${oc.name}</h3><small style='color:#888'>${oc.role}</small>`;
                el.onclick = () => openModal(oc); // CLICK EVENT ADDED
                list.appendChild(el);
            });
        }
        function openModal(oc) {
            currentOcId = oc.id;
            document.getElementById('modal-title').innerText = oc.name;
            document.getElementById('modal-role').innerText = oc.role;
            document.getElementById('modal-desc').innerText = oc.desc;
            document.getElementById('oc-modal').style.display = 'flex';
        }
        async function saveOc() {
            const name = document.getElementById('create-name').value;
            const role = document.getElementById('create-role').value;
            const desc = document.getElementById('create-desc').value;
            await db.from('characters').insert([{ user_id: user.id, name, role, "desc": desc }]);
            document.getElementById('oc-form').style.display='none'; loadOcs();
        }
        async function deleteOc() {
            if(!confirm("Delete this character?")) return;
            await db.from('characters').delete().eq('id', currentOcId);
            document.getElementById('oc-modal').style.display='none';
            loadOcs();
        }

        // --- TOOLS ---
        async function searchWord() {
            const w = document.getElementById('dict-search').value;
            try { 
                const req = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w}`); 
                const d = await req.json(); 
                let syns = "";
                if(d[0].meanings[0].synonyms.length > 0) syns = `<br><br><small style="color:#888">SYNONYMS: ${d[0].meanings[0].synonyms.slice(0,5).join(", ")}</small>`;
                document.getElementById('dict-result').innerHTML = `<h3 style="margin:0">${d[0].word}</h3><p>${d[0].meanings[0].definitions[0].definition}</p>${syns}`; 
            } catch(e) { document.getElementById('dict-result').innerText = "Word not found."; }
        }

        function generatePrompt() { 
            const genre = document.getElementById('prompt-genre').value;
            const prompts = {
                romance: ["Fake dating during a blizzard.", "Rivals forced to share a workspace.", "A love letter meant for someone else."],
                horror: ["The reflection blinked.", "A door appeared where there wasn't one.", "The GPS led them to a graveyard."],
                fantasy: ["A sword that gets heavier with guilt.", "The dragon is actually the bank manager.", "Magic is illegal, but you just sneezed sparks."],
                scifi: ["The AI asks for a bedtime story.", "Gravity stops for 5 minutes a day.", "First contact was a telemarketer."]
            };
            const p = prompts[genre];
            document.getElementById('prompt-result').innerText = p[Math.floor(Math.random()*p.length)];
        }

        function generateNames() {
            const count = parseInt(document.getElementById('name-count').value);
            const names = ["Rowan", "Sage", "River", "Alex", "Quinn", "Jordan", "Casey", "Riley", "Avery", "Cameron", "Dakota", "Ellis", "Emerson", "Finley", "Gray", "Harley", "Hayden", "Jamie", "Jesse", "Kendall"];
            // Shuffle and slice
            const result = names.sort(() => 0.5 - Math.random()).slice(0, count).join(", ");
            document.getElementById('name-result').innerText = result;
        }

        // --- UI UTILS ---
        function nav(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            // event.currentTarget.classList.add('active'); 
        }
        function openOcForm() { 
            document.getElementById('oc-form').style.display='block'; 
            document.getElementById('create-name').value = "";
            document.getElementById('create-role').value = "";
            document.getElementById('create-desc').value = "";
        }

        window.onload = checkSession;
    </script>
</body>
</html>
